<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        openai-chatkit {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <openai-chatkit id="chat-container"></openai-chatkit>
    </main>

    <!-- Load ChatKit from official CDN -->
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>

    <script>
        // Initialize ChatKit when the script loads
        window.addEventListener('load', async function() {
            const chatkit = document.getElementById('chat-container');

            if (!chatkit) {
                console.error('ChatKit element not found');
                return;
            }

            try {
                // Configure ChatKit with authentication
                chatkit.setOptions({
                    api: {
                        async getClientSecret(currentClientSecret) {
                            try {
                                console.log('Fetching client secret from backend...');

                                const response = await fetch('/api/chatkit/session', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        currentClientSecret: currentClientSecret
                                    })
                                });

                                if (!response.ok) {
                                    const error = await response.json();
                                    throw new Error(error.error || 'Failed to create session');
                                }

                                const data = await response.json();
                                console.log('Session created successfully');

                                return data.client_secret;
                            } catch (error) {
                                console.error('Failed to get client secret:', error);
                                throw error;
                            }
                        }
                    }
                });

                console.log('ChatKit configured successfully');
            } catch (error) {
                console.error('ChatKit configuration error:', error);
                chatkit.innerHTML =
                    '<div style="padding: 2rem; text-align: center; color: #d32f2f;">' +
                    '<h2>Chat Configuration Error</h2>' +
                    '<p>' + error.message + '</p>' +
                    '<p style="margin-top: 1rem; font-size: 0.9em;">Check the browser console for more details.</p>' +
                    '</div>';
            }
        });
    </script>
</body>
</html>
