<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        #chat-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <div id="chat-container"></div>
    </main>

    <script type="module">
        // Initialize ChatKit with backend authentication
        async function initChatKit() {
            const container = document.getElementById('chat-container');

            try {
                container.innerHTML = '<div style="padding: 2rem; text-align: center; color: #666;"><h2>Initializing chat...</h2></div>';

                // Get the API base URL (use relative path for same server, or configure for separate deployment)
                const apiBase = window.location.origin;

                // Fetch session from backend
                console.log('Fetching session from backend...');
                const response = await fetch(`${apiBase}/api/chatkit/session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to create session');
                }

                const session = await response.json();
                console.log('Session created successfully');

                // Import and initialize ChatKit
                const { ChatKit } = await import('https://cdn.jsdelivr.net/npm/@openai/chatkit@1/+esm');

                const chat = new ChatKit({
                    getClientSecret: async () => session.client_secret.value,
                    agentId: session.workflow_id,
                });

                // Render ChatKit in container
                container.innerHTML = '';
                container.appendChild(chat);

                console.log('ChatKit initialized successfully');

            } catch (error) {
                console.error('ChatKit initialization error:', error);
                container.innerHTML =
                    '<div style="padding: 2rem; text-align: center; color: #d32f2f;">' +
                    '<h2>Chat Initialization Error</h2>' +
                    '<p>' + error.message + '</p>' +
                    '<p style="margin-top: 1rem; font-size: 0.9em;">Check the browser console for more details.</p>' +
                    '</div>';
            }
        }

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initChatKit);
        } else {
            initChatKit();
        }
    </script>
</body>
</html>
