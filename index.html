<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        #chat-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <div id="chat-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@openai/chatkit/dist/chatkit.umd.js"></script>
    <script>
        const chat = new ChatKit({
            agentId: "wf_6933b5bbf3a08190baa9cd7603543d28098f257753de2806",
            container: document.getElementById("chat-container"),
            layout: "embedded"
        });
    </script>
</body>
</html>
