<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <div id="chat-container">
            <div id="status-message" style="padding: 3rem; text-align: center; color: white;">
                <h2 style="margin-bottom: 1rem;">🔄 Loading Chat...</h2>
                <p>Initializing ChatKit</p>
            </div>
        </div>
    </main>

    <!-- Load ChatKit from official CDN -->
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async onload="initChatKit()" onerror="handleScriptError()"></script>

    <script>
        function updateStatus(title, message, isError = false) {
            const statusEl = document.getElementById('status-message');
            if (statusEl) {
                statusEl.innerHTML = `
                    <h2 style="margin-bottom: 1rem; color: ${isError ? '#ff6b6b' : 'white'};">
                        ${isError ? '❌' : '🔄'} ${title}
                    </h2>
                    <p style="color: ${isError ? '#ffcccc' : 'rgba(255,255,255,0.9)'};">${message}</p>
                `;
            }
        }

        function handleScriptError() {
            updateStatus(
                'Failed to Load ChatKit',
                'Could not load the ChatKit library from CDN. Please check your internet connection and refresh the page.',
                true
            );
        }

        async function initChatKit() {
            try {
                updateStatus('Setting Up Chat', 'Waiting for ChatKit to initialize...');

                // Wait for the custom element to be defined
                if (customElements && customElements.whenDefined) {
                    await customElements.whenDefined('openai-chatkit');
                } else {
                    // Fallback: wait a bit
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                updateStatus('Connecting', 'Fetching authentication token...');

                // Create the ChatKit element
                const container = document.getElementById('chat-container');
                container.innerHTML = '<openai-chatkit id="chatkit-widget"></openai-chatkit>';

                const chatkit = document.getElementById('chatkit-widget');

                // Apply styles
                chatkit.style.cssText = `
                    display: block;
                    width: 100%;
                    height: 100%;
                    min-height: 600px;
                    background: white;
                    border-radius: 12px;
                    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                `;

                // Configure ChatKit with authentication
                chatkit.setOptions({
                    api: {
                        async getClientSecret(currentClientSecret) {
                            try {
                                const response = await fetch('/api/chatkit/session', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        currentClientSecret: currentClientSecret
                                    })
                                });

                                if (!response.ok) {
                                    const error = await response.json().catch(() => ({ error: 'Unknown error' }));
                                    throw new Error(error.error || `Server error: ${response.status}`);
                                }

                                const data = await response.json();
                                return data.client_secret;
                            } catch (error) {
                                updateStatus(
                                    'Authentication Error',
                                    `Failed to connect: ${error.message}. Check environment variables in Netlify.`,
                                    true
                                );
                                throw error;
                            }
                        }
                    }
                });

            } catch (error) {
                updateStatus(
                    'Initialization Error',
                    `${error.message}<br><br>Possible issues:<br>
                    • Environment variables not set in Netlify<br>
                    • Invalid API key or workflow ID<br>
                    • ChatKit library failed to load`,
                    true
                );
            }
        }

        // Fallback if script loads before this code runs
        if (window.customElements) {
            window.addEventListener('load', function() {
                if (typeof initChatKit === 'function' && !document.getElementById('chatkit-widget')) {
                    // Check if ChatKit script loaded but onload didn't fire
                    setTimeout(() => {
                        if (customElements.get('openai-chatkit')) {
                            initChatKit();
                        }
                    }, 500);
                }
            });
        }
    </script>
</body>
</html>
