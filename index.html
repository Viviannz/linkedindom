<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        #chat-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <div id="chat-container"></div>
    </main>

    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>
    <script>
        // Add error handling and debugging
        window.addEventListener('load', function() {
            console.log('Page loaded, ChatKit available:', typeof ChatKit !== 'undefined');

            try {
                if (typeof ChatKit === 'undefined') {
                    document.getElementById('chat-container').innerHTML =
                        '<div style="padding: 2rem; text-align: center; color: #666;">' +
                        '<h2 style="margin-bottom: 1rem;">ChatKit Loading...</h2>' +
                        '<p>If this message persists, there may be an issue with the ChatKit library.</p>' +
                        '<p style="margin-top: 1rem; font-size: 0.9em;">Agent ID: wf_6933b5bbf3a08190baa9cd7603543d28098f257753de2806</p>' +
                        '</div>';

                    // Try again after a delay
                    setTimeout(initChatKit, 1000);
                } else {
                    initChatKit();
                }
            } catch (error) {
                console.error('Error initializing ChatKit:', error);
                document.getElementById('chat-container').innerHTML =
                    '<div style="padding: 2rem; text-align: center; color: #d32f2f;">' +
                    '<h2>Error Loading Chat</h2>' +
                    '<p>' + error.message + '</p>' +
                    '</div>';
            }
        });

        function initChatKit() {
            if (typeof ChatKit === 'undefined') {
                console.error('ChatKit is not defined');
                return;
            }

            try {
                const chat = new ChatKit({
                    agentId: "wf_6933b5bbf3a08190baa9cd7603543d28098f257753de2806",
                    container: document.getElementById("chat-container"),
                    layout: "embedded"
                });
                console.log('ChatKit initialized successfully:', chat);
            } catch (error) {
                console.error('ChatKit initialization error:', error);
                document.getElementById('chat-container').innerHTML =
                    '<div style="padding: 2rem; text-align: center; color: #d32f2f;">' +
                    '<h2>Chat Initialization Error</h2>' +
                    '<p>' + error.message + '</p>' +
                    '</div>';
            }
        }
    </script>
</body>
</html>
