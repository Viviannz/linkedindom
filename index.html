<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatKit Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
    </header>

    <main>
        <div id="error-display" style="display: none; padding: 2rem; background: rgba(255, 107, 107, 0.2); border-radius: 12px; margin-bottom: 1rem; color: white; border: 2px solid #ff6b6b;">
            <h3 style="margin-bottom: 0.5rem;">❌ Error</h3>
            <p id="error-message"></p>
        </div>
        <div id="status-message" style="padding: 3rem; text-align: center; color: white;">
            <h2 style="margin-bottom: 1rem;">🔄 Loading Chat...</h2>
            <p>Initializing ChatKit</p>
        </div>
        <openai-chatkit id="chatkit-widget" style="display: none; width: 100%; min-height: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);"></openai-chatkit>
    </main>

    <!-- Load ChatKit from official CDN -->
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async onload="initChatKit()" onerror="handleScriptError()"></script>

    <script>
        function showError(message) {
            const errorDisplay = document.getElementById('error-display');
            const errorMessage = document.getElementById('error-message');
            const statusMessage = document.getElementById('status-message');
            if (errorDisplay && errorMessage) {
                errorMessage.innerHTML = message;
                errorDisplay.style.display = 'block';
            }
            if (statusMessage) {
                statusMessage.style.display = 'none';
            }
            console.error('ChatKit Error:', message);
        }

        function updateStatus(title, message, isError = false) {
            const statusEl = document.getElementById('status-message');
            if (statusEl) {
                statusEl.innerHTML = `
                    <h2 style="margin-bottom: 1rem; color: ${isError ? '#ff6b6b' : 'white'};">
                        ${isError ? '❌' : '🔄'} ${title}
                    </h2>
                    <p style="color: ${isError ? '#ffcccc' : 'rgba(255,255,255,0.9)'};">${message}</p>
                `;
                statusEl.style.display = 'block';
            }
            console.log(`[ChatKit] ${title}: ${message}`);
            if (isError) {
                showError(`${title}: ${message}`);
            }
        }

        function handleScriptError() {
            updateStatus(
                'Failed to Load ChatKit',
                'Could not load the ChatKit library from CDN. Please check your internet connection and refresh the page.',
                true
            );
        }

        async function initChatKit() {
            try {
                console.log('[ChatKit] Starting initialization...');
                updateStatus('Setting Up Chat', 'Waiting for ChatKit to initialize...');

                // Wait for the custom element to be defined
                if (customElements && customElements.whenDefined) {
                    console.log('[ChatKit] Waiting for openai-chatkit element to be defined...');
                    await customElements.whenDefined('openai-chatkit');
                    console.log('[ChatKit] openai-chatkit element is now defined');
                } else {
                    // Fallback: wait a bit
                    console.log('[ChatKit] customElements API not available, waiting 1s...');
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                const chatkit = document.getElementById('chatkit-widget');
                console.log('[ChatKit] Widget element found:', chatkit);

                if (!chatkit) {
                    throw new Error('ChatKit widget element not found in DOM');
                }

                // Add error event listeners to the widget
                chatkit.addEventListener('error', (e) => {
                    console.error('[ChatKit] Widget error event:', e);
                    showError(`ChatKit widget error: ${e.message || 'Unknown error'}`);
                });

                // Listen for any attribute changes
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        console.log('[ChatKit] Widget mutation:', mutation.type, mutation);
                    });
                });
                observer.observe(chatkit, { attributes: true, childList: true, subtree: true });

                updateStatus('Configuring', 'Setting up authentication...');

                console.log('[ChatKit] Configuring authentication...');

                // Show widget first, then configure
                chatkit.style.display = 'block';

                // Configure ChatKit with authentication
                chatkit.setOptions({
                    api: {
                        async getClientSecret(currentClientSecret) {
                            try {
                                console.log('[ChatKit] Requesting client secret from backend...',
                                    currentClientSecret ? '(refresh)' : '(initial)');

                                const response = await fetch('/api/chatkit/session', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        currentClientSecret: currentClientSecret
                                    })
                                });

                                console.log('[ChatKit] Backend response status:', response.status);

                                if (!response.ok) {
                                    const errorText = await response.text();
                                    console.error('[ChatKit] Backend error response:', errorText);
                                    let error;
                                    try {
                                        error = JSON.parse(errorText);
                                    } catch (e) {
                                        error = { error: errorText };
                                    }
                                    const errorMsg = error.error || error.details || `Server error: ${response.status}`;
                                    showError(`Authentication failed: ${errorMsg}<br><br>Make sure environment variables are set in Netlify.`);
                                    throw new Error(errorMsg);
                                }

                                const data = await response.json();
                                console.log('[ChatKit] Client secret received:', data.client_secret ? 'yes' : 'no');
                                console.log('[ChatKit] Client secret value:', data.client_secret);

                                if (!data.client_secret) {
                                    showError('Backend returned empty client_secret. Check server logs.');
                                    throw new Error('No client_secret in response');
                                }

                                return data.client_secret;
                            } catch (error) {
                                console.error('[ChatKit] getClientSecret error:', error);
                                showError(`Failed to authenticate: ${error.message}<br><br>Check:<br>• Environment variables in Netlify<br>• Network tab in browser dev tools<br>• Netlify function logs`);
                                throw error;
                            }
                        }
                    }
                });

                console.log('[ChatKit] Configuration complete');

                // Hide status message
                const statusMessage = document.getElementById('status-message');
                if (statusMessage) {
                    statusMessage.style.display = 'none';
                }

                console.log('[ChatKit] Widget is now visible and configured');

            } catch (error) {
                console.error('[ChatKit] Initialization error:', error);
                updateStatus(
                    'Initialization Error',
                    `${error.message}<br><br>Check browser console for details.`,
                    true
                );
            }
        }

        // Fallback if script loads before this code runs
        if (window.customElements) {
            window.addEventListener('load', function() {
                if (typeof initChatKit === 'function' && !document.getElementById('chatkit-widget').style.display) {
                    // Check if ChatKit script loaded but onload didn't fire
                    setTimeout(() => {
                        if (customElements.get('openai-chatkit')) {
                            console.log('[ChatKit] Fallback initialization triggered');
                            initChatKit();
                        }
                    }, 500);
                }
            });
        }
    </script>
</body>
</html>
